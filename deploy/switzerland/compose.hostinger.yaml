services:
  swiss-pilot:
    image: node:24-bookworm-slim
    user: "1000:1000"
    working_dir: /app
    command:
      - node
      - --input-type=module
      - -e
      - |
        // Stock Node image (the hosting runner does not build): fetch the checksummed backend release into
        // its own volume, install its locked dependencies once, then let bootstrap.mjs update the data volume.
        import {createWriteStream,existsSync,mkdirSync,readdirSync,rmSync,symlinkSync,writeFileSync} from 'node:fs';
        import {createHash} from 'node:crypto';
        import {execFileSync} from 'node:child_process';
        import {Readable,Transform} from 'node:stream';
        import {pipeline} from 'node:stream/promises';
        const sha=process.env.APP_ARCHIVE_SHA256;if(!/^[0-9a-f]{64}$$/.test(sha||''))throw Error('APP_CHECKSUM_MISSING');
        const releases='/srv/releases',dir=releases+'/'+sha;
        if(!existsSync(dir+'/.ready')){
          rmSync(dir,{recursive:true,force:true});mkdirSync(dir,{recursive:true});
          const r=await fetch(process.env.APP_ARCHIVE_URL);if(!r.ok)throw Error('APP_DOWNLOAD_FAILED');
          const hash=createHash('sha256');
          await pipeline(Readable.fromWeb(r.body),new Transform({transform(c,_,done){hash.update(c);done(null,c);}}),createWriteStream(releases+'/app.tgz'));
          if(hash.digest('hex')!==sha)throw Error('APP_CHECKSUM_FAILED');
          execFileSync('tar',['-xzf',releases+'/app.tgz','-C',dir]);rmSync(releases+'/app.tgz');
          symlinkSync('/app/data',dir+'/data');
          execFileSync('npm',['ci','--omit=dev','--ignore-scripts','--no-audit','--no-fund'],{cwd:dir,stdio:'inherit',env:{...process.env,HOME:'/tmp',npm_config_cache:'/tmp/npm'}});
          rmSync('/tmp/npm',{recursive:true,force:true});writeFileSync(dir+'/.ready',new Date().toISOString());
        }
        for(const old of readdirSync(releases))if(old!==sha)rmSync(releases+'/'+old,{recursive:true,force:true});
        process.chdir(dir);await (await import(dir+'/bootstrap.mjs')).start();
    depends_on:
      swiss-volume-init: {condition: service_completed_successfully}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=1777,size=512m", "/app:uid=1000,gid=1000,size=16m"]
    # 1.5 GB is enough without semantic search. HYBRID_RETRIEVAL=on peaked at 3.1 GB in the local rehearsal
    # (int8 index + ONNX query model + corpus): give it SWISS_MEM_LIMIT=4g.
    mem_limit: ${SWISS_MEM_LIMIT:-1536m}
    cpus: ${SWISS_CPUS:-1.0}
    environment:
      APP_ARCHIVE_URL: ${APP_ARCHIVE_URL}
      APP_ARCHIVE_SHA256: ${APP_ARCHIVE_SHA256}
      PUBLIC_BASE_PATH: /Switzerland
      PUBLIC_ORIGIN: https://midnight.vote
      PUBLIC_DATA_URL: ${PUBLIC_DATA_URL}
      PUBLIC_DATA_SHA256: ${PUBLIC_DATA_SHA256}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SEMANTIC_INDEX_URL: ${SEMANTIC_INDEX_URL:-}
      SEMANTIC_INDEX_SHA256: ${SEMANTIC_INDEX_SHA256:-}
      HYBRID_RETRIEVAL: ${HYBRID_RETRIEVAL:-off}
      SEMANTIC_WORKERS: ${SEMANTIC_WORKERS:-2}
      EMBEDDING_CACHE_DIR: /app/data/models
      # Answers, follow-ups and translations run on OpenAI (the LaunchPad GPUs ended on 25 Sep 2026).
      # OPENAI_API_KEY is set in the hosting panel only. MODEL_DAILY_BUDGET_USD stops model calls for the day.
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-openai}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-https://api.openai.com/v1}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-gpt-6-luna}
      INFERENCE_REASONING_EFFORT: ${INFERENCE_REASONING_EFFORT:-low}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-openai}
      MODEL_DAILY_BUDGET_USD: ${MODEL_DAILY_BUDGET_USD:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Who may use the app: open | paid (model routes need a verified account) | verified (the whole app).
      ACCESS_POLICY: ${ACCESS_POLICY:-paid}
      ASK_DAILY_LIMIT: ${ASK_DAILY_LIMIT:-20}
      ASK_WEEKLY_LIMIT: ${ASK_WEEKLY_LIMIT:-100}
      TRANSLATE_DAILY_LIMIT: ${TRANSLATE_DAILY_LIMIT:-60}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      # Shared with proxy.php so the reader's own address (not the bridge's) keys the sign-in rate limit.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      WEB_RESEARCH_MODEL: ${WEB_RESEARCH_MODEL:-}
      WEB_RESEARCH_DAILY_LIMIT: ${WEB_RESEARCH_DAILY_LIMIT:-60}
      WEB_RESEARCH_MAX_TOKENS: ${WEB_RESEARCH_MAX_TOKENS:-900}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODE: ${TYPESAFE_MODE:-off}
      FEEDBACK_RESEND_KEY: ${FEEDBACK_RESEND_KEY:-}
      FEEDBACK_FROM: ${FEEDBACK_FROM:-}
    volumes: [swiss-data:/app/data, swiss-releases:/srv/releases]
    networks: [swiss-private, existing-edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4318/Switzerland/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First start downloads and unpacks the corpus (several GB).
      start_period: 1800s
  swiss-volume-init:
    image: alpine:3.22
    command: [sh, -ec, "chown 1000:1000 /data /releases"]
    restart: "no"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes: [swiss-data:/data, swiss-releases:/releases]
volumes:
  swiss-data:
  swiss-releases:
networks:
  swiss-private:
  existing-edge:
    external: true
    name: midnight-rarimo-nfc_rarimo-edge
